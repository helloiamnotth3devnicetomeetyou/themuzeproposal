<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" width="100%" height="100%" role="img" aria-label="THE MUZE">
  <style>
    .mark { fill: #fc6fcf; opacity: 0; transform-box: fill-box; transform-origin: center; animation: assemble 2s cubic-bezier(.34, 1.3, .64, 1) infinite both; }
    .mark:nth-of-type(2) { animation-delay: .16s; }
    .mark:nth-of-type(3) { animation-delay: .32s; }
    @keyframes assemble {
      0% { opacity: 0; transform: translateY(46px) scale(.84) rotate(-7deg); }
      24% { opacity: 1; transform: translateY(0) scale(1.07) rotate(2deg); }
      34%, 74% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
      100% { opacity: 0; transform: translateY(-18px) scale(.96) rotate(3deg); }
    }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; opacity: 1; transform: none; } }
  </style>
  <path class="mark" d="M 70 10 L 190 10 L 60 260 L 0 260 L 65 135 L 5 135 Z" />
  <path class="mark" d="M 215 10 L 275 10 L 145 260 L 85 260 Z" />
  <path class="mark" d="M 300 10 L 360 10 L 295 135 L 355 135 L 290 260 L 170 260 Z" />
</svg>
