name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run lint

  docs:
    name: Doc links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm run docs:check-links

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run test:ci

      - name: Upload Vitest warning report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-warnings
          path: test-results/vitest-warnings.txt
          if-no-files-found: ignore

  build:
    name: Build
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://ci.example.com
      NEXT_PUBLIC_SUPABASE_URL: https://knbingxnnkutnukjyucw.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SUPABASE_PROJECT_REF: knbingxnnkutnukjyucw
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      AUTH_RATE_LIMIT_SECRET: ci-placeholder-rate-limit-secret-min-32chars
      SUBMISSION_RATE_LIMIT_SECRET: ci-placeholder-submission-secret-min-32chars
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-placeholder-turnstile-site-key
      TURNSTILE_SECRET_KEY: ci-placeholder-turnstile-secret-key
      TRUSTED_CLIENT_IP_HEADER: x-forwarded-for
      R2_ACCOUNT_ID: ci-placeholder-account-id
      R2_ACCESS_KEY_ID: ci-placeholder-access-key-id
      R2_SECRET_ACCESS_KEY: ci-placeholder-secret-access-key
      R2_PUBLIC_BUCKET: ci-placeholder-public
      R2_PRIVATE_BUCKET: ci-placeholder-private
      NEXT_PUBLIC_R2_PUBLIC_URL: https://ci-placeholder.example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --include=dev

      - run: npm run build

  e2e:
    name: E2E Tests
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://ci.example.com
      AUTH_RATE_LIMIT_SECRET: ci-placeholder-rate-limit-secret-min-32chars
      SUBMISSION_RATE_LIMIT_SECRET: ci-placeholder-submission-secret-min-32chars
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-placeholder-turnstile-site-key
      TURNSTILE_SECRET_KEY: ci-placeholder-secret-key
      TRUSTED_CLIENT_IP_HEADER: x-forwarded-for
      R2_ACCOUNT_ID: ci-placeholder-account-id
      R2_ACCESS_KEY_ID: ci-placeholder-access-key-id
      R2_SECRET_ACCESS_KEY: ci-placeholder-secret-access-key
      R2_PUBLIC_BUCKET: ci-placeholder-public
      R2_PRIVATE_BUCKET: ci-placeholder-private
      NEXT_PUBLIC_R2_PUBLIC_URL: https://ci-placeholder.example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --include=dev

      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Configure local Supabase for E2E
        run: |
          npx supabase status -o env | sed -n \
            -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p' \
            -e 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/p' \
            -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p' | tr -d '"' >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PROJECT_REF=127" >> "$GITHUB_ENV"

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Run E2E Tests
        run: npm run test:e2e
