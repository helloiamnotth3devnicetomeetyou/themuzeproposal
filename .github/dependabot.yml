version: 2

updates:
  # GitHub Actions — SHA 핀 자동 갱신
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Give normal releases seven days to settle; security updates bypass this.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  # npm 패키지 보안 업데이트
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Give normal releases seven days to settle; security updates bypass this.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    open-pull-requests-limit: 10
